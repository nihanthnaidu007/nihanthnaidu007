<svg viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Open to AI Engineer roles and research collaborations">
  <defs>
    <pattern id="fgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.055"/>
    </pattern>
    <linearGradient id="fdivider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="faccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#12667a"/>
    </linearGradient>
    <radialGradient id="fglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="180" fill="#080C14"/>
  <rect width="1200" height="180" fill="url(#fgrid)"/>

  <!-- top divider -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#fdivider)"/>

  <!-- corner brackets -->
  <g stroke="#00D4FF" stroke-width="2" fill="none" opacity="0.45">
    <path d="M18 42 V18 H44"/>
    <path d="M1156 18 H1182 V42"/>
    <path d="M1182 156 V162 H1156"/>
    <path d="M44 162 H18 V138"/>
  </g>

  <!-- terminal prompt -->
  <text x="64" y="60" font-family="'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace" font-size="16" font-weight="500">
    <tspan fill="#00D4FF">nihanth@ai</tspan><tspan fill="#8892A4">:~$</tspan><tspan fill="#39FF14"> ./connect</tspan>
  </text>
  <rect x="235" y="49" width="9" height="15" fill="#39FF14" opacity="0.9"/>

  <!-- sign-off headline -->
  <text x="63" y="105" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#F0F4FF" letter-spacing="0.3">Open to AI Engineer roles and research collaborations</text>

  <!-- accent underline -->
  <rect x="66" y="120" width="86" height="4" rx="2" fill="url(#faccent)"/>
  <rect x="160" y="120" width="20" height="4" rx="2" fill="#F5A623"/>

  <!-- contact line -->
  <text x="66" y="152" font-family="'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace" font-size="14.5">
    <tspan fill="#00D4FF">nihanthnaiduk.tech</tspan><tspan fill="#555F70">   ·   </tspan><tspan fill="#C0C8D8">in/nihanthnaidu007</tspan><tspan fill="#555F70">   ·   </tspan><tspan fill="#C0C8D8">github.com/nihanthnaidu007</tspan>
  </text>

  <!-- ================= broadcast motif (open to work / reaching out) ================= -->
  <g>
    <!-- signal arcs opening to the left -->
    <g fill="none" stroke="#00D4FF" stroke-linecap="round">
      <path d="M1087.5 57.5 A46 46 0 0 0 1087.5 122.5" stroke-width="2" opacity="0.50"/>
      <path d="M1062 32 A82 82 0 0 0 1062 148" stroke-width="2" opacity="0.32"/>
      <path d="M1038 8 A116 116 0 0 0 1038 172" stroke-width="1.6" opacity="0.18"/>
    </g>

    <!-- nodes the signal reaches -->
    <g fill="#00D4FF">
      <circle cx="1074" cy="90" r="3"/>
      <circle cx="1038" cy="90" r="3"/>
      <circle cx="1004" cy="90" r="3"/>
    </g>

    <!-- source -->
    <circle cx="1122" cy="90" r="30" fill="url(#fglow)"/>
    <circle cx="1122" cy="90" r="13" fill="#080C14" stroke="#39FF14" stroke-width="2.4"/>
    <circle cx="1122" cy="90" r="5" fill="#39FF14"/>
  </g>
</svg>
