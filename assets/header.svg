<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nihanth Naidu K, AI Engineer">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.055"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#12667a"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="#080C14"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- corner brackets (terminal frame) -->
  <g stroke="#00D4FF" stroke-width="2" fill="none" opacity="0.45">
    <path d="M18 44 V18 H44"/>
    <path d="M1156 18 H1182 V44"/>
    <path d="M1182 256 V282 H1156"/>
    <path d="M44 282 H18 V256"/>
  </g>

  <!-- terminal prompt line -->
  <text x="64" y="74" font-family="'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace" font-size="17" font-weight="500">
    <tspan fill="#00D4FF">nihanth@ai</tspan><tspan fill="#8892A4">:~$</tspan><tspan fill="#39FF14"> ./deploy --verified</tspan>
  </text>
  <rect x="285" y="62" width="10" height="16" fill="#39FF14" opacity="0.9"/>

  <!-- name -->
  <text x="63" y="152" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="60" font-weight="800" fill="#F0F4FF" letter-spacing="0.5">Nihanth Naidu K</text>

  <!-- accent underline -->
  <rect x="66" y="170" width="92" height="5" rx="2" fill="url(#accent)"/>
  <rect x="166" y="170" width="22" height="5" rx="2" fill="#F5A623"/>

  <!-- subtitle -->
  <text x="66" y="211" font-family="'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace" font-size="19">
    <tspan fill="#00D4FF">AI Engineer</tspan><tspan fill="#555F70">  /  </tspan><tspan fill="#F0F4FF">Multi-Agent Systems</tspan><tspan fill="#555F70">  /  </tspan><tspan fill="#00D4FF">Production RAG</tspan>
  </text>

  <!-- tagline -->
  <text x="66" y="245" font-family="'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace" font-size="16" fill="#39FF14" font-weight="500">trust &gt; capability</text>

  <!-- ================= multi-agent graph motif ================= -->
  <g>
    <!-- edges: supervisor -> agents -->
    <g stroke="#00D4FF" stroke-width="1.5" opacity="0.32">
      <line x1="980" y1="150" x2="1090" y2="70"/>
      <line x1="980" y1="150" x2="1120" y2="150"/>
      <line x1="980" y1="150" x2="1080" y2="235"/>
      <line x1="980" y1="150" x2="870" y2="235"/>
      <line x1="980" y1="150" x2="840" y2="90"/>
    </g>
    <!-- sub-edges: agents -> leaves -->
    <g stroke="#00D4FF" stroke-width="1.2" opacity="0.22">
      <line x1="1090" y1="70" x2="1155" y2="40"/>
      <line x1="840" y1="90" x2="780" y2="150"/>
    </g>

    <!-- supervisor glow + node -->
    <circle cx="980" cy="150" r="46" fill="url(#glow)"/>
    <circle cx="980" cy="150" r="30" fill="#080C14" stroke="#00D4FF" stroke-width="2.5"/>
    <circle cx="980" cy="150" r="5" fill="#00D4FF"/>

    <!-- agent nodes (hollow ring + center dot) -->
    <g fill="#080C14" stroke-width="2.2">
      <circle cx="1090" cy="70"  r="16" stroke="#00D4FF"/>
      <circle cx="1120" cy="150" r="16" stroke="#39FF14"/>
      <circle cx="1080" cy="235" r="16" stroke="#F5A623"/>
      <circle cx="870"  cy="235" r="16" stroke="#00D4FF"/>
      <circle cx="840"  cy="90"  r="16" stroke="#00D4FF"/>
    </g>
    <g stroke="none">
      <circle cx="1090" cy="70"  r="3.5" fill="#00D4FF"/>
      <circle cx="1120" cy="150" r="3.5" fill="#39FF14"/>
      <circle cx="1080" cy="235" r="3.5" fill="#F5A623"/>
      <circle cx="870"  cy="235" r="3.5" fill="#00D4FF"/>
      <circle cx="840"  cy="90"  r="3.5" fill="#00D4FF"/>
    </g>

    <!-- leaf nodes -->
    <g fill="#080C14" stroke="#00D4FF" stroke-width="1.8" opacity="0.85">
      <circle cx="1155" cy="40"  r="9"/>
      <circle cx="780"  cy="150" r="9"/>
    </g>
  </g>
</svg>
