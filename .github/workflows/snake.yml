name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"      # rebuilds once a day at 00:00 UTC
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write             # required so GITHUB_TOKEN can push the output branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # One file per line. Query string customizes each output.
          # color_dots takes EXACTLY 5 colors: 0-contribution first, then low to high.
          outputs: |
            dist/github-snake-cyan.svg?color_snake=#39FF14&color_dots=#0d1117,#0a3a4a,#12667a,#1aa5c4,#00d4ff
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: update snake animation [skip ci]"
